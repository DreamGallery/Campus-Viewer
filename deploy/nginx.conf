server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/json text/css application/javascript;
    location = /catalog/manifest.json {
        alias /runtime/current/web/catalog/manifest.json;
        add_header Cache-Control "no-store" always;
    }
    location /catalog/ {
        alias /runtime/current/web/catalog/;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/images/ {
        alias /runtime/current/web/assets/images/;
        add_header Cache-Control "no-cache" always;
    }
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location /music/ {
        alias /runtime/current/music/;
        types { audio/flac flac; application/json json; image/png png; image/webp webp; }
        add_header Cache-Control "no-cache" always;
    }
    location /audio/ {
        alias /runtime/current/audio/;
        types { audio/flac flac; audio/mpeg mp3; audio/mp4 m4a; }
        add_header Cache-Control "no-cache" always;
    }
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location / { try_files $uri $uri/ /index.html; }
}
